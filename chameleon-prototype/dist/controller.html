<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07040f" />
    <title>Alchemist Controller</title>
    <style>:root{--gold:#ffd34d;--cyan:#3ef0ff;--violet:#8a5cff;--bg:#07040f;--ink:#e8e0ff;--accent:#ffd34d;--accent2:#3ef0ff;--realm-bg:#1d0d08;--beat:.6s;--btn-ink:#fff;--btn-shadow:0 2px 6px #000a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{background:radial-gradient(ellipse at 50% 0%, var(--realm-bg) 0%, var(--bg) 70%);height:100%;color:var(--ink);touch-action:none;margin:0;font-family:Verdana,DejaVu Sans,sans-serif;transition:background .4s;overflow:hidden}header{background:#07040fcc;border-bottom:1px solid #ffffff1a;justify-content:space-between;align-items:center;padding:14px 20px;display:flex}h1{letter-spacing:4px;color:var(--accent);margin:0;font-size:16px;transition:color .3s}#realm{letter-spacing:2px;color:var(--accent2);min-height:1.2em;margin-top:3px;font-size:10px}h1 small{letter-spacing:2px;color:#bfb3d9;margin-top:3px;font-size:10px;display:block}.pill{letter-spacing:1px;background:#1b1430;border:1px solid #fff2;border-radius:999px;align-items:center;gap:8px;padding:6px 12px;font-size:12px;font-weight:700;display:flex}.dot{background:#6a6080;border-radius:50%;width:10px;height:10px;box-shadow:0 0 #0000}.linked .dot{background:#5dff7a;box-shadow:0 0 10px #5dff7a}.waiting .dot{background:var(--gold)}main{grid-template-columns:1fr 1fr 1fr;place-items:center;gap:16px;height:calc(100% - 64px);padding:16px;display:grid}.panel{flex-direction:column;align-items:center;gap:12px;display:flex}.label{letter-spacing:3px;color:#bfb3d9;font-size:11px}#pad{border:2px solid var(--accent2);background:radial-gradient(circle,#1b1430 0%,#120a24 70%);border-radius:50%;width:min(42vmin,240px);height:min(42vmin,240px);position:relative;box-shadow:inset 0 0 30px #000,0 0 30px #8a5cff33}#knob{background:radial-gradient(circle at 35% 30%, #fff6c8, var(--accent) 45%, #3a2a10);width:38%;height:38%;box-shadow:0 0 22px var(--accent);border-radius:50%;margin:-19% 0 0 -19%;position:absolute;top:50%;left:50%}#tilt{background:#0b0820;border:2px dashed #3ef0ff66;border-radius:50%;width:min(34vmin,190px);height:min(34vmin,190px);position:relative}#tilt:before,#tilt:after{content:"";background:#3ef0ff33;position:absolute}#tilt:before{width:1px;top:8%;bottom:8%;left:50%}#tilt:after{height:1px;top:50%;left:8%;right:8%}#bubble{background:var(--cyan);width:26px;height:26px;box-shadow:0 0 18px var(--cyan);border-radius:50%;margin:-13px 0 0 -13px;position:absolute;top:50%;left:50%}#readout{color:var(--cyan);min-height:1.2em;font-family:DejaVu Sans Mono,monospace;font-size:12px}button{cursor:pointer;font-family:inherit}#enable{border:1px solid var(--cyan);color:var(--cyan);letter-spacing:1px;background:#0b2a33;border-radius:10px;padding:10px 16px;font-size:12px;font-weight:700}#shift{background:radial-gradient(circle at 50% 35%, var(--accent) 0%, var(--realm-bg) 70%, #05020c 100%);width:min(46vmin,250px);height:min(46vmin,250px);color:var(--btn-ink);letter-spacing:2px;box-shadow:0 0 0 6px #ffffff18, 0 0 40px var(--accent), inset 0 -10px 30px #0006;text-shadow:var(--btn-shadow);animation:beat var(--beat) ease-out infinite;border:4px solid #fff6c8;border-radius:50%;font-size:clamp(16px,4vmin,22px);font-weight:700;line-height:1.3;transition:transform 60ms}@keyframes beat{0%{box-shadow:0 0 0 12px #ffffff30, 0 0 60px var(--accent), inset 0 -10px 30px #0006}60%,to{box-shadow:0 0 0 4px #ffffff10, 0 0 30px var(--accent), inset 0 -10px 30px #0006}}#shift small{letter-spacing:3px;opacity:.85;margin-top:4px;font-size:.6em;display:block}#shift.pressed{background:radial-gradient(circle at 50% 35%, var(--accent2) 0%, var(--realm-bg) 60%, #05020c 100%);transform:scale(.94)}@media (prefers-reduced-motion:reduce){#shift{animation:none}}footer{text-align:center;color:#6a6080;letter-spacing:1px;font-size:10px;position:fixed;bottom:8px;left:0;right:0}@media (orientation:portrait){main{grid-template-rows:auto auto auto;grid-template-columns:1fr;overflow:auto}}</style>
    <script type="module" crossorigin src="./assets/controller-D75m8-c0.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/protocol-DPHLsFyI.js">
  </head>
  <body>
    <header>
      <h1>ALCHEMIST LINK<small>THE PARALLEL CLOCK · PHONE CONTROLLER</small><div id="realm"></div></h1>
      <div id="status" class="pill"><span class="dot"></span><span id="statusText">CONNECTING…</span></div>
    </header>
    <main>
      <section class="panel">
        <div class="label">MOVE</div>
        <div id="pad"><div id="knob"></div></div>
      </section>
      <section class="panel">
        <div class="label">SHADOW LENS · TILT TO AIM</div>
        <div id="tilt"><div id="bubble"></div></div>
        <div id="readout">β 0° · γ 0°</div>
        <button id="enable">ENABLE TILT</button>
      </section>
      <section class="panel">
        <button id="shift"><span id="shiftLabel">SHIFT REALM</span><small id="shiftSub">/ SLAM STOP</small></button>
        <div class="label" id="sent">0 PACKETS</div>
      </section>
    </main>
    <footer>Tilt needs HTTPS on most phones (npm run dev:https). Joystick + button work everywhere.</footer>
  </body>
</html>
