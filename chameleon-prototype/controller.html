<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07040f" />
    <title>Alchemist Controller</title>
    <style>
      :root { --gold: #ffd34d; --cyan: #3ef0ff; --violet: #8a5cff; --bg: #07040f; --ink: #e8e0ff;
        --accent: #ffd34d; --accent2: #3ef0ff; --realm-bg: #1d0d08; --beat: 0.6s; --btn-ink: #fff; --btn-shadow: 0 2px 6px #000a; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 0%, var(--realm-bg) 0%, var(--bg) 70%); color: var(--ink); transition: background .4s;
        font-family: Verdana, 'DejaVu Sans', sans-serif; overflow: hidden; touch-action: none; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #ffffff1a; background: #07040fcc; }
      h1 { margin: 0; font-size: 16px; letter-spacing: 4px; color: var(--accent); transition: color .3s; }
      #realm { font-size: 10px; letter-spacing: 2px; color: var(--accent2); margin-top: 3px; min-height: 1.2em; }
      h1 small { display: block; font-size: 10px; letter-spacing: 2px; color: #bfb3d9; margin-top: 3px; }
      .pill { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; letter-spacing: 1px; padding: 6px 12px; border-radius: 999px; background: #1b1430; border: 1px solid #ffffff22; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #6a6080; box-shadow: 0 0 0 0 transparent; }
      .linked .dot { background: #5dff7a; box-shadow: 0 0 10px #5dff7a; }
      .waiting .dot { background: var(--gold); }
      main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: center; justify-items: center; height: calc(100% - 64px); padding: 16px; }
      .panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .label { font-size: 11px; letter-spacing: 3px; color: #bfb3d9; }
      #pad { position: relative; width: min(42vmin, 240px); height: min(42vmin, 240px); border-radius: 50%; background: radial-gradient(circle, #1b1430 0%, #120a24 70%);
        border: 2px solid var(--accent2); box-shadow: inset 0 0 30px #000, 0 0 30px #8a5cff33; }
      #knob { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff6c8, var(--accent) 45%, #3a2a10); box-shadow: 0 0 22px var(--accent); }
      #tilt { position: relative; width: min(34vmin, 190px); height: min(34vmin, 190px); border-radius: 50%; border: 2px dashed #3ef0ff66; background: #0b0820; }
      #tilt::before, #tilt::after { content: ''; position: absolute; background: #3ef0ff33; }
      #tilt::before { left: 50%; top: 8%; bottom: 8%; width: 1px; } #tilt::after { top: 50%; left: 8%; right: 8%; height: 1px; }
      #bubble { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
      #readout { font-size: 12px; font-family: 'DejaVu Sans Mono', monospace; color: var(--cyan); min-height: 1.2em; }
      button { font-family: inherit; cursor: pointer; }
      #enable { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--cyan); background: #0b2a33; color: var(--cyan); font-weight: bold; letter-spacing: 1px; font-size: 12px; }
      #shift { width: min(46vmin, 250px); height: min(46vmin, 250px); border-radius: 50%; border: 4px solid #fff6c8;
        background: radial-gradient(circle at 50% 35%, var(--accent) 0%, var(--realm-bg) 70%, #05020c 100%); color: var(--btn-ink); font-weight: bold; font-size: clamp(16px, 4vmin, 22px);
        letter-spacing: 2px; line-height: 1.3; box-shadow: 0 0 0 6px #ffffff18, 0 0 40px var(--accent), inset 0 -10px 30px #0006; transition: transform .06s;
        text-shadow: var(--btn-shadow); animation: beat var(--beat) ease-out infinite; }
      @keyframes beat { 0% { box-shadow: 0 0 0 12px #ffffff30, 0 0 60px var(--accent), inset 0 -10px 30px #0006; } 60%, 100% { box-shadow: 0 0 0 4px #ffffff10, 0 0 30px var(--accent), inset 0 -10px 30px #0006; } }
      #shift small { display: block; font-size: 0.6em; letter-spacing: 3px; opacity: .85; margin-top: 4px; }
      #shift.pressed { transform: scale(0.94); background: radial-gradient(circle at 50% 35%, var(--accent2) 0%, var(--realm-bg) 60%, #05020c 100%); }
      @media (prefers-reduced-motion: reduce) { #shift { animation: none; } }
      footer { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: #6a6080; letter-spacing: 1px; }
      @media (orientation: portrait) { main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; overflow: auto; } }
    </style>
  </head>
  <body>
    <header>
      <h1>ALCHEMIST LINK<small>THE PARALLEL CLOCK · PHONE CONTROLLER</small><div id="realm"></div></h1>
      <div id="status" class="pill"><span class="dot"></span><span id="statusText">CONNECTING…</span></div>
    </header>
    <main>
      <section class="panel">
        <div class="label">MOVE</div>
        <div id="pad"><div id="knob"></div></div>
      </section>
      <section class="panel">
        <div class="label">SHADOW LENS · TILT TO AIM</div>
        <div id="tilt"><div id="bubble"></div></div>
        <div id="readout">β 0° · γ 0°</div>
        <button id="enable">ENABLE TILT</button>
      </section>
      <section class="panel">
        <button id="shift"><span id="shiftLabel">SHIFT REALM</span><small id="shiftSub">/ SLAM STOP</small></button>
        <div class="label" id="sent">0 PACKETS</div>
      </section>
    </main>
    <footer>Tilt needs HTTPS on most phones (npm run dev:https). Joystick + button work everywhere.</footer>
    <script type="module" src="/src/net/controller.ts"></script>
  </body>
</html>
